[versions]
agp              = "7.4.2"
kotlin           = "2.0.21"
appcompat        = "1.6.1"
constraintlayout = "2.1.4"
material         = "1.9.0"
core-ktx         = "1.10.1"
junit            = "4.12"
robolectric      = "4.11.1"
test-runner      = "1.5.2"
espresso         = "3.5.1"
camerax          = "1.2.3"
retrofit         = "2.9.0"
okhttp           = "4.12.0"
gson             = "2.10.1"
exifinterface    = "1.3.7"
opencv           = "4.9.0"
mlkit-text-recognition-japanese = "16.0.1"

[libraries]
kotlin-stdlib         = { module = "org.jetbrains.kotlin:kotlin-stdlib-jdk8",              version.ref = "kotlin" }
appcompat             = { module = "androidx.appcompat:appcompat",                          version.ref = "appcompat" }
constraintlayout      = { module = "androidx.constraintlayout:constraintlayout",            version.ref = "constraintlayout" }
material              = { module = "com.google.android.material:material",                  version.ref = "material" }
core-ktx              = { module = "androidx.core:core-ktx",                                version.ref = "core-ktx" }
camerax-core          = { module = "androidx.camera:camera-core",                           version.ref = "camerax" }
camerax-camera2       = { module = "androidx.camera:camera-camera2",                        version.ref = "camerax" }
camerax-lifecycle     = { module = "androidx.camera:camera-lifecycle",                      version.ref = "camerax" }
camerax-view          = { module = "androidx.camera:camera-view",                           version.ref = "camerax" }
retrofit              = { module = "com.squareup.retrofit2:retrofit",                       version.ref = "retrofit" }
retrofit-gson         = { module = "com.squareup.retrofit2:converter-gson",                 version.ref = "retrofit" }
okhttp-logging        = { module = "com.squareup.okhttp3:logging-interceptor",              version.ref = "okhttp" }
gson                  = { module = "com.google.code.gson:gson",                             version.ref = "gson" }
exifinterface         = { module = "androidx.exifinterface:exifinterface",                  version.ref = "exifinterface" }
opencv                = { module = "org.opencv:opencv",                                     version.ref = "opencv" }
mlkit-text-recognition-japanese = { module = "com.google.mlkit:text-recognition-japanese",   version.ref = "mlkit-text-recognition-japanese" }
junit                 = { module = "junit:junit",                                           version.ref = "junit" }
robolectric           = { module = "org.robolectric:robolectric",                           version.ref = "robolectric" }
test-runner           = { module = "androidx.test:runner",                                  version.ref = "test-runner" }
espresso-core         = { module = "androidx.test.espresso:espresso-core",                  version.ref = "espresso" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android      = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
